<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Data Vault</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Login Screen -->
    <div class="login-wrapper" id="loginContainer">
        <div class="login-card">
            <div class="login-icon">🔐</div>
            <h2>Personal Vault</h2>
            <p>Apna data access karne ke liye login karein</p>

            <div class="login-error" id="loginError">❌ Galat Username ya Password!</div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Username darj karein" value="admin">
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Password darj karein">
                    <button type="button" class="eye-btn" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button class="btn-primary full-width" onclick="handleLogin()">Unlock Vault 🔓</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="app-layout" id="mainContainer" style="display: none;">
        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">🛡️</span>
                    <span>My Vault</span>
                </div>
                <button class="close-menu" onclick="toggleMenu()">✕</button>
            </div>

            <div class="menu-label">CATEGORIES</div>
            <nav class="category-menu" id="categoryMenu">
                <!-- Categories JS se dynamically load hongi -->
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" onclick="toggleMenu()">☰</button>
                    <h1 id="currentCategoryTitle">All Data</h1>
                </div>
                <div class="topbar-right" style="display: flex; gap: 10px; align-items: center;">
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="searchInput" placeholder="Search email, bank, app..." onkeyup="filterData()">
                    </div>
                    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Switch Theme">☀️</button>
                </div>
            </header>

            <div class="cards-grid" id="cardsContainer">
                <!-- Data Cards JS se load honge -->
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Copied to clipboard! ✅</div>

    <script src="script.js"></script>
</body>
</html>
